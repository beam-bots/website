name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  CI:
    uses: beam-bots/.github/.github/workflows/zola-ci.yml@15faf010d76683ee1fc1c79ae0697becc0f7af4b # main
    with:
      enable-deploy: ${{ github.ref == 'refs/heads/main' }}
