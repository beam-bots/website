name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  CI:
    uses: beam-bots/.github/.github/workflows/zola-ci.yml@5f8b983e1556b5ae6ccb3d5f8c147dfd3b1148a1 # main
    with:
      enable-deploy: ${{ github.ref == 'refs/heads/main' }}
