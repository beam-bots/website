name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  CI:
    uses: beam-bots/.github/.github/workflows/zola-ci.yml@09e2ebee138f992d5a93706f30fb29f99344bb09 # main
    with:
      enable-deploy: ${{ github.ref == 'refs/heads/main' }}
