name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  CI:
    uses: beam-bots/.github/.github/workflows/zola-ci.yml@dfa4225cc80d40272e764eb9a0380229f853b767 # main
    with:
      enable-deploy: ${{ github.ref == 'refs/heads/main' }}
