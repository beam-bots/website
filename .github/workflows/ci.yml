name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  CI:
    uses: beam-bots/.github/.github/workflows/zola-ci.yml@159809b71b2b10f77d7dee0fe63e141133e14a0a # main
    with:
      enable-deploy: ${{ github.ref == 'refs/heads/main' }}
