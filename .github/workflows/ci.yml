name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  CI:
    uses: beam-bots/.github/.github/workflows/zola-ci.yml@e48e67e4321fa91481bce6423e1434031ac2173c # main
    with:
      enable-deploy: ${{ github.ref == 'refs/heads/main' }}
