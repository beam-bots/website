name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  CI:
    uses: beam-bots/.github/.github/workflows/zola-ci.yml@92400250ce33feee00b5108ec655626e79f320e0 # main
    with:
      enable-deploy: ${{ github.ref == 'refs/heads/main' }}
