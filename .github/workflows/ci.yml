name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  CI:
    uses: beam-bots/.github/.github/workflows/zola-ci.yml@7bb7997a94fb1d8a416906a62c2c51b89563f3f1 # main
    with:
      enable-deploy: ${{ github.ref == 'refs/heads/main' }}
