name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  CI:
    uses: beam-bots/.github/.github/workflows/zola-ci.yml@5cdd4c90be327fe280b53ca7d6ca60bd22008083 # main
    with:
      enable-deploy: ${{ github.ref == 'refs/heads/main' }}
