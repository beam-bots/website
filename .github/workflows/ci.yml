name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  CI:
    uses: beam-bots/.github/.github/workflows/zola-ci.yml@c6199e1f170902c825c6b6ca7d40e254f1aaba2c # main
    with:
      enable-deploy: ${{ github.ref == 'refs/heads/main' }}
