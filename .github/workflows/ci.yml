name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  CI:
    uses: beam-bots/.github/.github/workflows/zola-ci.yml@24ab362dce9f1a3b771a1e8bcb60440c6bac6e9d # main
    with:
      enable-deploy: ${{ github.ref == 'refs/heads/main' }}
