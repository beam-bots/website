name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  CI:
    uses: beam-bots/.github/.github/workflows/zola-ci.yml@b978bb2af8d00a21a295c4ad40c929c8e29a3d69 # main
    with:
      enable-deploy: ${{ github.ref == 'refs/heads/main' }}
