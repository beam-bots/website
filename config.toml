base_url = "https://beambots.dev"
title = "Beam Bots"
description = "Resilient Robotics with Elixir - a framework for building fault-tolerant robots with a declarative DSL, OTP supervision, and real-time control"
compile_sass = true
build_search_index = true
generate_feeds = true
feed_filenames = ["atom.xml"]
taxonomies = [
  {name = "tags", render = false}
]

[markdown.highlighting]
style = "class"
light_theme = "github-light"
dark_theme = "github-dark"

[extra]
author = "James Harton"
github_url = "https://github.com/beam-bots"
docs_url = "https://hexdocs.pm/bb"
hex_url = "https://hex.pm/packages/bb"
