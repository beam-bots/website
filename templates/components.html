{% component video(src: string, caption: string = "") %}
<figure style="margin: 0;">
  <video
    src="{{ src }}"
    controls
    muted
    loop
    playsinline
    preload="metadata"
    style="width: 100%; height: auto; border-radius: 4px;"
  ></video>
  {% if caption %}<figcaption style="font-size: 0.9em; opacity: 0.75; margin-top: 0.5em;">{{ caption }}</figcaption>{% endif %}
</figure>
{% endcomponent video %}

{% component youtube(id: string) %}
<div style="position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden;">
  <iframe
    src="https://www.youtube.com/embed/{{ id }}"
    style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;"
    allowfullscreen
    loading="lazy"
  ></iframe>
</div>
{% endcomponent youtube %}
